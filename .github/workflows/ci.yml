name: CI
on: [push]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.SHOP_STORE_OS2 }}" ] || [ -z "${{ secrets.SHOP_ACCESS_TOKEN }}" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "Skipping Lighthouse CI: SHOP_STORE_OS2 and SHOP_ACCESS_TOKEN secrets are not configured in repository."
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi
      - name: Lighthouse
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: shopify/lighthouse-ci-action@v1
        with:
          store: ${{ secrets.SHOP_STORE_OS2 }}
          password: ${{ secrets.SHOP_PASSWORD_OS2 }}
          access_token: ${{ secrets.SHOP_ACCESS_TOKEN }}
          collection_handle: all
          lhci_github_app_token: ${{ secrets.LHCI_GITHUB_TOKEN }}
          pull_theme: ${{ secrets.SHOP_PULL_THEME }}

  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
